<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPS Dashboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
      type="image/x-icon"
    />
    <script src="{{ url_for('static', filename='js/gauge.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CF8MRJ0Y8V"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CF8MRJ0Y8V");
    </script>
    <!--<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>-->
  </head>
  <body class="dark-mode">
    <button id="dark-mode-toggle">🌕</button>

    <div class="container">
      <h1>UPS Dashboard</h1>

      <div id="statusBadge" class="status-badge online">
        <span class="status-dot"></span> Online
      </div>

      <div class="gauges-row">
        <div class="gauge-card">
          <div class="gauge-title">Battery Charge</div>
          <canvas id="batteryChargeGauge"></canvas>
          <div id="batteryChargeValue" class="gauge-value">--%</div>
        </div>
        <div class="gauge-card">
          <div class="gauge-title">Input Voltage</div>
          <canvas id="inputVoltageGauge"></canvas>
          <div id="inputVoltageValue" class="gauge-value">-- V</div>
        </div>
        <div class="gauge-card">
          <div class="gauge-title">UPS Load</div>
          <canvas id="upsLoadGauge"></canvas>
          <div id="upsLoadValue" class="gauge-value">-- %</div>
        </div>
      </div>

      <div class="charts-container">
        <div class="chart-card">
          <canvas id="inputVoltageChart"></canvas>
        </div>
        <div class="chart-card">
          <canvas id="upsLoadChart"></canvas>
        </div>
        <div class="chart-card chart-full-width">
          <canvas id="batteryChargeChart"></canvas>
        </div>
      </div>
    </div>
    <footer>
      <p>
        &copy; Created with 🧉 by
        <a href="https://juangonzalez.com.ar">Juan Gonzalez</a> - ©
      </p>
      <p><a href="https://github.com/juanchixd/UPS_Lyonn_web">Repository</a></p>
    </footer>

    <script>
      var data = {{ data | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toggle_mode.js') }}"></script>
  </body>
</html>
